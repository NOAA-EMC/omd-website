$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Branding
description: USWDS site branding with logo, site name, and optional slogan.
status: stable
props:
  type: object
  properties:
    site_logo:
      type: string
      title: Site logo URL
    site_name:
      type: string
      title: Site name
    site_slogan:
      type: string
      title: Site slogan
    home_url:
      type: string
      title: Home URL
      default: /
