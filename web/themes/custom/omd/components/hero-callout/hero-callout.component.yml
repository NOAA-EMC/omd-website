$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero callout
description: USWDS hero with an optional original image background and call to action.
status: stable
props:
  type: object
  properties:
    hero_heading:
      type: string
      title: Hero heading
    hero_body:
      type: string
      title: Hero body copy
    hero_image_uri:
      type: string
      title: Hero image URI
      description: Original image file URI displayed behind the hero content.
    call_to_action_label:
      type: string
      title: Call-to-action label
    call_to_action_url:
      type: string
      title: Call-to-action URL
    variant:
      type: string
      title: Component variant
      description: Choose between full-width or contained layout.
      enum:
        - default
        - contained
      default: default

