$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Event
description: Full event detail layout with schedule, attendance information, and registration action.
status: stable
props:
  type: object
  properties:
    event_title:
      type: string
      title: Event title
    event_hero_image_uri:
      type: string
      title: Hero image URI
    event_summary:
      type:
        - object
        - string
      title: Summary
    event_format:
      type:
        - object
        - string
      title: Format
    event_start_value:
      type: string
      title: Raw start date and time
      description: ISO 8601 value used by the Collection-style calendar date.
    event_end_value:
      type: string
      title: Raw end date and time
      description: ISO 8601 value used to determine same-day and multi-day schedules.
    event_location:
      type:
        - object
        - string
      title: Location or meeting details
    event_recurring:
      type: boolean
      title: Recurring event
    event_link_url:
      type: string
      title: Registration or join URL
    event_link_label:
      type: string
      title: Registration or join link label
      default: View event details
    event_tags:
      type:
        - object
        - string
      title: Topics
    event_details:
      type:
        - object
        - string
      title: Event details
    event_classes:
      type: array
      title: Event classes
      items:
        type: string
