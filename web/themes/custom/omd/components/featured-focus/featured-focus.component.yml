$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Featured Focus
description: Highlighted content feature with optional media and call to action.
status: stable
props:
  type: object
  properties:
    label:
      type: string
      title: Label
    title:
      type: string
      title: Heading
    summary:
      type:
        - object
        - string
      title: Summary
    image_src:
      type: string
      title: Image URL
    image_alt:
      type: string
      title: Image alternative text
    image_position:
      type: string
      title: Image position
      enum:
        - right
        - left
      default: right
    link_url:
      type: string
      title: Call-to-action URL
    link_label:
      type: string
      title: Call-to-action label
      default: Learn more
    classes:
      type: array
      title: Additional CSS classes
      items:
        type: string
  required:
    - title
